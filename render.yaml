services:
  - type: web
    name: apexbook-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: node backend/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: apexbook-postgres
          property: connectionString

databases:
  - name: apexbook-postgres
    databaseName: apexbook
    user: apexbook_user
    plan: free
    region: oregon
