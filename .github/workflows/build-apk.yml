name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build --workspace=frontend
        env:
          VITE_API_URL: https://apexbook-backend.onrender.com/api

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-reports
          path: |
            frontend/android/app/build/reports/
            frontend/android/build/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-calculator-app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.5
          name: "ApexBook Secret Calculator Android APK v1.1.5 (Last Sale & Pre-Draw Edit/Delete)"
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            ### ApexBook Connected Application - Android APK v1.1.5
            Download and install the Android APK below.

            - **Build Type:** Debug APK (demo & simulation only, strictly nonredeemable)
            - **Version:** v1.1.5 (versionCode 7)
            - **Package ID:** `com.app.calculator`
            - **App Name:** Calculator
            - **New in v1.1.5:**
              - **Last Sale Details Display:** Prominently displays the latest booking details on the booking screen and in Last Sale from the moment booked until the draw is taken.
              - **Itemized Details:** Full number booked, category, count, rate, D.Amount, and C.Amount breakdown.
              - **Pre-Draw Edit & Delete:** Edit numbers/counts or delete active bookings before draw cutoff time.
              - **Cutoff Protection:** Edit and delete are automatically locked and rejected once the draw closes or is taken.
            - **Centralized Cloud Backend Architecture:**
              - Auto-connected to Central Cloud Backend: `https://apexbook-backend.onrender.com/api`
              - Independent 24/7 cloud connectivity (Zero reliance on host PC or local network)
              - Supports any Wi-Fi network and mobile cellular data (4G/5G) worldwide
              - Automatic cold-start retry mechanism for seamless connection
              - Clean, zero-configuration login screen: Username, Password, Login button
            - **Secret Camouflage Triggers:**
              - Arithmetic Trigger: `11 + 22 =`
              - Invisible Corner Trigger: 5 rapid taps on the top-left corner
            - **Default Cloud Demo Accounts (Central Database):**
              - Subdealer: `test` / `test`
              - Agent: `agent` / `agnet` (or `agent`)
              - Admin: `admin` / `admin`
              - Subdealer: `test` / `test`
              - Agent: `agent` / `agnet` (or `agent`)
              - Admin: `admin` / `admin`
            - **Core Features Verified:**
              - 5 Booking Modes: Book, Range, Set, Hundreds, Ones
              - WhatsApp Smart Paste parser with live validation and preview
              - Centralized Cloud PostgreSQL Database synchronization
              - Real-time Today Report for DR1, KL, DR6, DR8
              - Role-based permissions and hierarchical security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
