name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build --workspace=frontend
        env:
          VITE_API_URL: https://apexbook-backend.onrender.com/api

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-reports
          path: |
            frontend/android/app/build/reports/
            frontend/android/build/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-calculator-app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.7
          name: "ApexBook Secret Calculator Android APK v1.1.7"
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            ### ApexBook Connected Application - Android APK v1.1.7
            Download and install the Android APK below.

            - **Build Type:** Debug APK
            - **Version:** v1.1.7
            - **Package ID:** `com.app.calculator`
            - **New in v1.1.7:**
              - **Draw Closing Times (10 min before draw):** DR1 → 12:50 PM · KL → 2:50 PM · DR6 → 5:50 PM · DR8 → 7:50 PM
              - **Next-Day Booking Opens at 9 PM:** After close, booking for the next draw opens at 9:00 PM IST
              - **Booking Unavailable Screen:** When closed, Number Booking shows a clear "Booking Unavailable — opens at 9 PM" screen instead of the form
              - **Fixed App Resume:** Switching to another app and coming back no longer logs you out or resets to the calculator screen
              - **Double Back to Exit:** First back press shows "Press back again to exit" toast; second press exits the app
              - **Smart Paste Improved:** Clipboard paste now works on Android without showing permission error — uses native fallback automatically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
