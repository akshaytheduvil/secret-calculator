name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build --workspace=frontend
        env:
          VITE_API_URL: https://apexbook-backend.onrender.com/api

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-reports
          path: |
            frontend/android/app/build/reports/
            frontend/android/build/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-calculator-app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.15
          name: "ApexBook Secret Calculator Android APK v1.1.15"
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            ### ApexBook Connected Application - Android APK v1.1.15
            - **Admin Dashboard:** Today Sale now shows D.Amount (wholesale); new Today DC card added
            - **Admin Winning Report:** Shows Agent name column; Prize/DC/Total values fixed (were showing 0)
            - **Agent Winning Report:** DEALER column now shows Sub Dealer name (not customer name)
            - **Sub Dealer Winning Report:** DEALER column shows Customer name
            - **Backend:** Dashboard SQL uses total_d_amount for sale; DC sum added; winning report SQL joins agent name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
