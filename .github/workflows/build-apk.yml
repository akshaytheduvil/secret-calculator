name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build --workspace=frontend

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        run: npx cap sync android --prefix frontend

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-calculator-app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Secret Calculator Android APK v1.0.0"
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            ### Secret Calculator Connected Application APK
            Download the Android APK below and install on your phone.
            - **App Name:** Calculator
            - **Secret Trigger:** `11 + 22 =`
            - **Demo Accounts:**
              - Admin: `admin` / `admin123`
              - Agent: `agent` / `agent123`
              - Sub-dealer: `test` / `test`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
