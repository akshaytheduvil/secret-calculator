name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build --workspace=frontend

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-reports
          path: |
            frontend/android/app/build/reports/
            frontend/android/build/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-calculator-app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.3
          name: "ApexBook Secret Calculator Android APK v1.1.3 (Debug Build)"
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            ### ApexBook Connected Application - Android Debug APK v1.1.3
            Download the Android Debug APK below and install on your phone.
            - **Build Type:** Debug APK (demo & testing only, nonredeemable)
            - **Version:** v1.1.3 (versionCode 5)
            - **Package ID:** `com.app.calculator`
            - **App Name:** Calculator
            - **Centralized Cloud Connection:**
              - Auto-connected to Central Backend with full HTTPS encryption
              - Clean, zero-configuration login screen: Username, Password, Login button
              - Works across mobile cellular data (4G/5G) and any Wi-Fi network worldwide
            - **Secret Triggers:**
              - Arithmetic: `11 + 22 =`
              - Hidden: 5 consecutive taps on the invisible top-left corner
            - **Demo Accounts (Verified in Central Database):**
              - Subdealer: `test` / `test`
              - Agent: `agent` / `agnet` (or `agent`)
              - Admin: `admin` / `admin`
            - **Features Included:**
              - 5 Booking Modes: Book, Range, Set, Hundreds, Ones
              - WhatsApp Smart Paste parser with live preview
              - Centralized PostgreSQL Database synchronization
              - Real-time Today Report for DR1, KL, DR6, DR8
            - **Portion 3 Features:**
              - 5 Booking Modes: Book, Range, Set, Hundreds, Ones
              - WhatsApp Smart Paste parser with live preview
              - Strict bill inspection, removal, and persistent submission
              - Real-time Today Report with draw tabs (DR1, KL, DR6, DR8)
              - Centralized PostgreSQL backend (zero localStorage fallback)
              - Native social result sharing (WhatsApp, Telegram, SMS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
