name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build --workspace=frontend
        env:
          VITE_API_URL: https://apexbook-backend.onrender.com/api

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-reports
          path: |
            frontend/android/app/build/reports/
            frontend/android/build/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-calculator-app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.10
          name: "ApexBook Secret Calculator Android APK v1.1.10"
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            ### ApexBook Connected Application - Android APK v1.1.10
            Download and install the Android APK below.

            - **Build Type:** Debug APK
            - **Version:** v1.1.10
            - **Package ID:** `com.app.calculator`
            - **New in v1.1.10:**
              - **Sales Report D/C Amount Fixed:** D.AMOUNT and C.AMOUNT now correctly fetched from DB and displayed (were showing zero)
              - **Daily Report Fixed:** Shows daily totals (all bills aggregated by date+game, not individual bills); SALE column now uses D.AMOUNT (wholesale price); BALANCE = D.AMOUNT − Winning Amount
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
